name = "hex-primality-mathlib"
defaultTargets = ["HexPrimalityMathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPrimality"
git = "https://github.com/leanprover/hex-primality.git"
rev = "v0.7.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d870b9068518a0870842d15a0cd42637ec30b587"

[[lean_lib]]
name = "HexPrimalityMathlib"
